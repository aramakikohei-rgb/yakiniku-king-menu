<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yakiniku King Thailand · Menu</title>
    <meta name="description" content="Yakiniku King Thailand: 100-minute all-you-can-eat yakiniku. Courses and menu." />
    <meta name="theme-color" content="#a71a1c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kanit:wght@500;700&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Yakiniku King Thailand's menu, a DEMO for the MonBooking pitch: the LINE rich menu's "View menu" opens it with
      ?lang=th|en|ja|zh. One static folder, no build, no tracking.
      FROM THEIR OWN MATERIAL (yakiniku-king.jp, used with the client's agreement, minutes 2026-11-24): the logo, the
      three courses, the 100-minute meal, last order 20 minutes before, the dishes and which course has them, and the
      photos in img/. PLACEHOLDERS: every Thai price, the drinks prices and the translations. Replace with theirs.
    -->
    <style>
      :root {
        --red: #a71a1c;
        --red-deep: #7d1012;
        --ink: #241c1a;
        --muted: #7d6a5c;
        --paper: #f6efe6;
        --card: #ffffff;
        --line: #eadccd;
        --gold: #c8932e;
        --display: 'Dela Gothic One', 'Kanit', 'Noto Sans JP', sans-serif;
        --body: 'Noto Sans Thai', 'Noto Sans JP', 'Noto Sans SC', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        line-height: 1.5;
      }
      html[lang='th'] {
        --display: 'Kanit', 'Dela Gothic One', sans-serif;
      }
      html[lang='zh'] {
        --display: 'Noto Sans SC', sans-serif;
        --body: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif;
      }
      html[lang='zh'] h1,
      html[lang='zh'] h2,
      html[lang='th'] h1,
      html[lang='th'] h2 {
        font-weight: 700;
      }
      img {
        display: block;
        max-width: 100%;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }

      /* top bar */
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 4px solid var(--red);
      }
      .bar .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
      }
      .bar img {
        height: 38px;
        width: auto;
      }
      .langs {
        display: flex;
        padding: 3px;
        border-radius: 999px;
        background: #f1e6d9;
      }
      .langs button {
        border: 0;
        padding: 6px 10px;
        border-radius: 999px;
        background: none;
        font: 800 12px/1 'Kanit', 'Noto Sans SC', sans-serif;
        letter-spacing: 0.04em;
        color: var(--muted);
        cursor: pointer;
      }
      .langs button[aria-pressed='true'] {
        background: var(--red);
        color: #fff;
      }

      /* hero */
      .hero {
        position: relative;
        color: #fff;
        background: var(--ink) url('img/course-king.jpg') center / cover;
      }
      .hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(36, 28, 26, 0.15), rgba(36, 28, 26, 0.92) 85%);
      }
      .hero .wrap {
        position: relative;
        padding: 96px 20px 24px;
      }
      .kicker {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--red);
        font-size: 13px;
        font-weight: 700;
        animation: rise 0.6s both;
      }
      .hero h1 {
        margin: 10px 0 6px;
        font: 400 clamp(30px, 8.5vw, 48px) / 1.1 var(--display);
        animation: rise 0.6s 0.08s both;
      }
      .hero p {
        margin: 0;
        max-width: 34em;
        color: #f1e0d6;
        font-size: 15px;
        animation: rise 0.6s 0.16s both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        animation: rise 0.6s 0.24s both;
      }
      .facts li {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }

      section {
        padding: 28px 16px 6px;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        font: 400 23px/1.2 var(--display);
      }
      h2::before {
        content: '';
        flex: none;
        width: 8px;
        height: 24px;
        border-radius: 4px;
        background: var(--red);
      }
      .lede {
        margin: -6px 0 14px;
        color: var(--muted);
        font-size: 13.5px;
      }

      /* courses */
      .courses {
        display: grid;
        gap: 14px;
      }
      .course {
        width: 100%;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 20px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(120, 40, 20, 0.08);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .course[aria-pressed='true'] {
        border-color: var(--red);
      }
      .course img {
        width: 100%;
        aspect-ratio: 11 / 4;
        object-fit: cover;
      }
      /* A span inside the card's button, so it is made a block: otherwise its side padding does not
         hold and the words run to the card's edges. */
      .course .info {
        display: block;
        padding: 16px 22px 20px;
      }
      .course .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .course h3 {
        margin: 0;
        font-size: 18px;
      }
      .price {
        flex: none;
        font: 400 22px/1 var(--display);
        color: var(--red);
      }
      .course p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }
      .tag {
        display: inline-block;
        margin-top: 10px;
        padding: 3px 11px;
        border-radius: 999px;
        background: #fbeee6;
        color: var(--red);
        font-size: 12px;
        font-weight: 700;
      }
      .course[aria-pressed='true'] .tag {
        background: var(--red);
        color: #fff;
      }
      .note {
        margin: 12px 4px 0;
        color: var(--muted);
        font-size: 13px;
      }

      /* the five signatures */
      .rail {
        display: flex;
        gap: 12px;
        margin: 0 -16px;
        padding: 4px 16px 10px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }
      .sig {
        flex: none;
        width: 200px;
        scroll-snap-align: start;
        border-radius: 18px;
        background: var(--card);
        overflow: hidden;
        box-shadow: 0 8px 22px rgba(120, 40, 20, 0.08);
        transition: opacity 0.25s;
      }
      .sig .pic {
        background: radial-gradient(circle at 50% 60%, #fff 0 55%, #fbeee6 56%);
        padding: 10px;
      }
      .sig img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: contain;
      }
      .sig .name {
        padding: 10px 12px 14px;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.35;
      }
      .sig .name small {
        display: block;
        margin-bottom: 4px;
        color: var(--gold);
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      /* category chips */
      .chips {
        position: sticky;
        top: 62px;
        z-index: 5;
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        overflow-x: auto;
        background: var(--paper);
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chips a {
        flex: none;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      /* a category: its photo, then its dishes */
      .cat {
        padding-top: 22px;
        scroll-margin-top: 120px;
      }
      .cat .card {
        border-radius: 18px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 8px 22px rgba(120, 40, 20, 0.06);
      }
      .cat .photo {
        position: relative;
      }
      .cat .photo img {
        width: 100%;
        aspect-ratio: 5 / 3;
        object-fit: cover;
      }
      .cat .photo h3 {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 30px 16px 12px;
        background: linear-gradient(180deg, transparent, rgba(36, 28, 26, 0.85));
        color: #fff;
        font: 400 21px/1.2 var(--display);
      }
      .cat .plain {
        margin: 0;
        padding: 14px 16px 4px;
        font: 400 21px/1.2 var(--display);
      }
      .items {
        display: grid;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        transition: opacity 0.25s;
      }
      .item .name {
        flex: 1;
        font-weight: 600;
        font-size: 15px;
      }
      .item .sub {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 12.5px;
      }
      .in {
        flex: none;
        display: flex;
        gap: 4px;
      }
      .in b {
        min-width: 24px;
        height: 22px;
        padding: 0 4px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #f1e6d9;
        color: #b9a796;
        font: 700 11px/1 'Kanit', sans-serif;
      }
      .in b.on {
        background: var(--ink);
        color: #fff;
      }
      .out {
        opacity: 0.32;
      }
      .out .name {
        text-decoration: line-through;
        text-decoration-color: rgba(36, 28, 26, 0.4);
      }
      .badge {
        margin-left: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--gold);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        vertical-align: 2px;
      }

      .book {
        position: sticky;
        bottom: 0;
        z-index: 10;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(246, 239, 230, 0), var(--paper) 30%);
      }
      .book a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        max-width: 688px;
        margin: 0 auto;
        padding: 16px;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 30px rgba(167, 26, 28, 0.35);
      }
      footer {
        padding: 24px 16px 8px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="wrap">
        <img src="logo.png" alt="Yakiniku King" width="108" height="38" />
        <div class="langs" role="group" aria-label="Language">
          <button type="button" data-lang="th">TH</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">JP</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
    </header>

    <div class="hero">
      <div class="wrap">
        <span class="kicker" data-t="kicker"></span>
        <h1 data-t="title"></h1>
        <p data-t="lead"></p>
        <ul class="facts">
          <li data-t="fact1"></li>
          <li data-t="fact2"></li>
          <li data-t="fact3"></li>
        </ul>
      </div>
    </div>

    <main class="wrap">
      <section>
        <h2 data-t="courses"></h2>
        <div class="courses" id="courses"></div>
        <p class="note" data-t="kids"></p>
      </section>

      <section>
        <h2 data-t="signatures"></h2>
        <p class="lede" data-t="signaturesLede"></p>
        <div class="rail" id="signatures"></div>
      </section>

      <section>
        <h2 data-t="premium"></h2>
        <p class="lede" data-t="premiumLede"></p>
        <div class="rail" id="premium"></div>
      </section>

      <nav class="chips" id="chips" aria-label="Categories"></nav>
      <div id="menu"></div>
      <footer data-t="footer"></footer>
    </main>

    <div class="book">
      <a href="https://line.me/R/ti/p/@491fwluf"
        ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4" /></svg
        ><span data-t="book"></span
      ></a>
    </div>

    <script>
      // The page's words in each language.
      const T = {
        th: {

          fact1: '100 นาที', fact2: 'สั่งรอบสุดท้าย 20 นาทีก่อนหมดเวลา', fact3: 'สั่งผ่านแท็บเล็ต',
          courses: 'คอร์สบุฟเฟต์', include: 'แตะเพื่อดูเมนูในคอร์ส', chosen: 'แสดงเมนูของคอร์สนี้ด้านล่าง',

          sigTag: '招牌', popular: '人气',

      // The three courses, as in Japan: each later one has everything in the one before. Thai prices are placeholders.
      const COURSES = [
        { key: '58', img: 'img/course-58.jpg', price: 599,
          name: { th: 'คอร์ส 58 รายการ', en: '58-Item Course', ja: '58品コース', zh: '58品套餐' },

      ]

      // The five signatures (King and Premium only).
      const SIGNATURES = [
        { img: 'img/godai-karubi.png', n: { th: 'คาลบิคิง', en: 'King Kalbi', ja: 'きんぐカルビ', zh: 'King招牌牛五花' } },
        { img: 'img/godai-shimacho.png', n: { th: 'ไส้ใหญ่วัวทั้งเส้นหมักไห ซอสยังนยม', en: 'Whole pot-marinated beef intestine, Korean yangnyeom', ja: '韓式ヤンニョムだれ 壺漬け一本シマチョウ', zh: '韩式调味酱坛腌整条牛大肠' } },

      const LANGS = ['th', 'en', 'ja', 'zh']
      const COURSE_KEYS = ['58', 'K', 'P']
      const MARK = { '58': '58', K: 'K', P: 'P' }
      const params = new URLSearchParams(location.search)
      let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : 'th'
      let course = COURSE_KEYS.includes(params.get('course')) ? params.get('course') : 'K'
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const has = (marks, key) => (key === '58' ? marks.startsWith('58') : marks.includes(key))

      function render() {
        const t = T[lang]
        document.documentElement.lang = lang
        document.title = `Yakiniku King Thailand · ${{ th: 'เมนู', en: 'Menu', ja: 'メニュー', zh: '菜单' }[lang]}`
        document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t[el.dataset.t]))
        document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang))

        document.getElementById('courses').innerHTML = COURSES.map(
          (c) => `<button type="button" class="course" data-course="${c.key}" aria-pressed="${c.key === course}">
            <img src="${c.img}" alt="" loading="lazy" />
            <span class="info">
              <span class="top"><h3>${esc(c.name[lang])}</h3><span class="price">฿${c.price.toLocaleString()}</span></span>
              <p>${esc(c.desc[lang])}</p>
              <span class="tag">${esc(c.key === course ? t.chosen : t.include)}</span>
            </span>
          </button>`
        ).join('')

        // The signatures and premium cuts dim when the chosen course does not have them.
        const rail = (list, marks) => list.map(
          (d) => `<div class="sig${has(marks, course) ? '' : ' out'}">
            <div class="pic"><img src="${d.img}" alt="" loading="lazy" /></div>
            <div class="name"><small>${esc(marks === 'P' ? COURSES[2].name[lang] : t.sigTag)}</small>${esc(d.n[lang])}</div>
          </div>`
        ).join('')
        document.getElementById('signatures').innerHTML = rail(SIGNATURES, KP)
        document.getElementById('premium').innerHTML = rail(PREMIUM, 'P')

        document.getElementById('chips').innerHTML = MENU.map((cat) => `<a href="#${cat.key}">${esc(cat.name[lang])}</a>`).join('')

        document.getElementById('menu').innerHTML = MENU.map(
          (cat) => `<section class="cat" id="${cat.key}"><div class="card">
            ${cat.img
              ? `<div class="photo"><img src="${cat.img}" alt="" loading="lazy" /><h3>${esc(cat.name[lang])}</h3></div>`
              : `<h3 class="plain">${esc(cat.name[lang])}</h3>`}
            <div class="items">${cat.items.map((item) => {
              const out = item.in && !has(item.in, course)
              const marks = item.in
                ? `<span class="in" aria-hidden="true">${COURSE_KEYS.map((k) => `<b class="${has(item.in, k) ? 'on' : ''}">${MARK[k]}</b>`).join('')}</span>`
                : ''
              return `<div class="item${out ? ' out' : ''}"><span class="name">${esc(item.n[lang])}${item.hot ? `<span class="badge">${esc(t.popular)}</span>` : ''}${item.s ? `<span class="sub">${esc(item.s[lang])}</span>` : ''}</span>${marks}</div>`
            }).join('')}</div>
          </div></section>`
        ).join('')
      }

      document.addEventListener('click', (event) => {
        const langButton = event.target.closest('.langs button')
        const courseButton = event.target.closest('.course')
        if (langButton) lang = langButton.dataset.lang
        else if (courseButton) course = courseButton.dataset.course
        else return
        const url = new URL(location.href)
        url.searchParams.set('lang', lang)
        url.searchParams.set('course', course)
        history.replaceState(null, '', url)
        render()
      })
      render()
